<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辞任届 佐伯和也</title>
<style>
  @page {
    size: A4 portrait;
    margin: 30mm 25mm;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #f0f0f0;
  }
  body {
    font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", "Noto Serif JP", "IPAmjMincho", "IPAexMincho", "IPAMincho", "MS Mincho", serif;
    color: #111;
  }
  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 12mm auto;
    padding: 40mm 30mm;
    background: #fff;
    box-sizing: border-box;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .title {
    text-align: center;
    font-size: 28pt;
    letter-spacing: 1.2em;
    text-indent: 1.2em;
    margin: 0 0 24mm 0;
    font-weight: 600;
  }
  .body-text {
    font-size: 13pt;
    line-height: 2.4;
    text-indent: 1em;
    margin: 0 0 22mm 0;
  }
  .date {
    text-align: right;
    font-size: 13pt;
    margin: 0 0 16mm 0;
  }
  .signee {
    text-align: right;
    font-size: 13pt;
    margin: 0 0 26mm 0;
  }
  .signee .name {
    letter-spacing: 0.4em;
  }
  .seal {
    display: inline-block;
    margin-left: 1.5em;
    color: #111;
    border: 1.5px solid #111;
    border-radius: 50%;
    width: 2.2em;
    height: 2.2em;
    line-height: 2.2em;
    text-align: center;
    font-size: 9pt;
    vertical-align: middle;
  }
  .addressee {
    font-size: 14pt;
    letter-spacing: 0.2em;
  }
  @media print {
    html, body { background: #fff; }
    .sheet { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <h1 class="title">辞任届</h1>

    <p class="body-text">
      私は、このたび一身上の都合により、貴社取締役を辞任いたしたく、ここにお届けいたします。
    </p>

    <p class="date">令和8年6月15日</p>

    <p class="signee">
      <span class="name">氏名　佐伯和也</span>
      <span class="seal">印</span>
    </p>

    <p class="addressee">有限会社千成　御中</p>
  </div>
</body>
</html>
